name: Refresh market data

on:
  schedule:
    # Every 30 minutes. Edit the line below to change just this timer —
    # see the cron cheatsheet in the README for examples.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh-markets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch market data
        run: python scripts/fetch_markets.py

      - name: Commit updated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/markets.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh market data [skip ci]"
          git push
