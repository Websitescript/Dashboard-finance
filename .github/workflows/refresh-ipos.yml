name: Refresh IPO data

on:
  schedule:
    # IPO details (dates, price bands) barely change intraday, and GMP is
    # only meaningfully updated a few times a day — every 2 hours is plenty.
    # Edit the line below to change just this timer — see the cron
    # cheatsheet in the README for examples.
    - cron: "0 */2 * * *"
  workflow_dispatch: {} # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh-ipos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch IPO data
        env:
          IPOALERTS_API_KEY: ${{ secrets.IPOALERTS_API_KEY }}
        run: python scripts/fetch_ipos.py

      - name: Commit updated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh IPO data [skip ci]"
          git push
